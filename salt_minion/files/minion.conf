{% from 'banner_macro.jinja' import banner %}
{{ banner() }}
{% if grains['id'] is match('salt-master*') %}
master: 127.0.0.1
{% elif grains['roles'] and 'docker' in grains['roles'] %}
master: {{ salt['cmd.run']('getent hosts salt-master | awk \'{print $1}\'') }}
{% else %}
master: 3.89.222.213
{% endif %}
hash_type: sha512
grains:
  roles:
    - minion
